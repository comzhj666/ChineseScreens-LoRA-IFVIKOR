# Dataset configuration for SDXL 1.0 Base LoRA using sd-scripts.
# Captions are mirrored beside images because sd-scripts expects same-basename .txt files.

[general]
caption_extension = ".txt"
shuffle_caption = false
keep_tokens = 1

[[datasets]]
# TODO: decide after GPU check; 1024 is the SDXL-native placeholder.
resolution = 1024
# TODO: decide after GPU check.
batch_size = 1
enable_bucket = true
bucket_no_upscale = true
min_bucket_reso = 256
max_bucket_reso = 2048
bucket_reso_steps = 64

